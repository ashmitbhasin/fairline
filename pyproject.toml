[project]
name = "fairline"
version = "0.1.0"
description = "Agent-run market-making research desk for sports prediction markets. Phase 0: record and measure, no capital at risk."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "certifi>=2024.2",
  "httpx>=0.27",
  "websockets>=13",
  "cryptography>=42",
  "pyyaml>=6",
  "pyarrow>=16",
]

[project.optional-dependencies]
dev = ["pytest>=8", "pytest-asyncio>=0.23"]

[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["tape*", "fairvalue*", "board*"]

[tool.setuptools.package-data]
board = ["static/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
