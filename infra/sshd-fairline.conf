# Installed by infra/setup.sh as /etc/ssh/sshd_config.d/10-fairline.conf (first value wins, so this
# overrides the cloud image's 60-cloudimg-settings.conf). Port 22 is open to any address
# (infra/fl open-ssh) so the laptop's pull survives network changes; only the ubuntu user's key gets in.
AuthenticationMethods publickey
PasswordAuthentication no
KbdInteractiveAuthentication no
PermitRootLogin no
AllowUsers ubuntu
MaxAuthTries 3
LoginGraceTime 20
X11Forwarding no
